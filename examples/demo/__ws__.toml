[workspace]
name = "demo"
version = "0.1.0"
packages = ["math", "text", "app"]

[[package]]
file = "extra.kl"
name = "demo/extra"
version = "0.1.0"
dependencies = ["demo/math"]
natives = []

[[native]]
name = "demo_ws_native"
sources = ["native/ws_native.c"]
