import os
import lit.formats

# ---------------------------------------------------------------------------
# Basic configuration
# ---------------------------------------------------------------------------
config.name = "Koala-Test"
config.suffixes = [".kl"]

config.test_source_root = os.path.dirname(os.path.abspath(__file__))
config.test_exec_root = os.path.join(config.build_root, "test")

# Directories/files that lit should never scan (matched by basename).
config.excludes = [
    "CMakeLists.txt",
    "lit.cfg",
    "lit.site.cfg",
    "test_pkg",
]

# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
# ShTest treats files without RUN: lines as trivially-passing. We exclude
# them by basename via config.excludes. NOTE: this means same-named .kl
# files across directories share the same exclude status — avoid duplicate
# basenames where only some files carry RUN: lines.
def _exclude_files_without_run_on_first_line():
    for root, dirs, files in os.walk(config.test_source_root):
        # Prune excluded directories early.
        dirs[:] = [d for d in dirs if d not in config.excludes]

        for f in files:
            if not any(f.endswith(s) for s in config.suffixes):
                continue

            path = os.path.join(root, f)
            try:
                with open(path, "r", errors="ignore") as fh:
                    if "RUN:" not in fh.readline():
                        config.excludes.append(f)
                        print("Skipping (no RUN: on line 1): %s" % path)
            except OSError:
                pass


_exclude_files_without_run_on_first_line()

config.test_format = lit.formats.ShTest()

# ---------------------------------------------------------------------------
# Tool locations and environment
# ---------------------------------------------------------------------------
config.koala_bin_path = os.path.join(config.build_root, "bin")

# Prepend freshly-built tools to PATH so tests invoke the current build.
config.environment["PATH"] = os.pathsep.join(
    (config.koala_bin_path, config.environment["PATH"])
)

# Standard library / runtime search path for the Koala toolchain.
config.environment["KOALA_PATH"] = config.koala_path

# Substitutions available in RUN: lines (e.g., "%koala input.kl -o %t").
config.substitutions.append(("%koala", os.path.join(config.koala_bin_path, "koala")))
